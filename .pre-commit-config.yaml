# Run with prek: `uv run prek run --all-files`, or `uv run prek install` for a
# git hook. `repo: builtin` hooks are prek-only (plain pre-commit can't run them).
repos:
  - repo: builtin
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: trailing-whitespace
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.4
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
