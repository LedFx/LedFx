# Run with prek: `uv run prek run --all-files`, or `uv run prek install` for a
# git hook. `repo: builtin` hooks are prek-only (plain pre-commit can't run them).
# ledfx_frontend/ is a built bundle: whitespace there can sit inside JS strings.
exclude: ^ledfx_frontend/
repos:
  - repo: builtin
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: trailing-whitespace
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.4
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  # Structural check that ClassVar annotations describe their literals.
  # Ruff's RUF012 cannot see this (it only asks that an annotation exist).
  # language: python lets prek provision the interpreter via its uv
  # integration: no python(3) on PATH needed (Windows, uv-only setups),
  # and it works in CI where the project venv is not synced.
  - repo: local
    hooks:
      - id: classvar-audit
        name: classvar audit
        entry: python tools/classvar_audit.py
        language: python
        types: [python]
        pass_filenames: false
        require_serial: true
  # GitHub Actions security audit. Config in .github/zizmor.yml; the gate
  # is --min-severity high (informational findings stay advisory).
  # prek provisions zizmor itself (language: python), so no system tooling.
  # rev is the zizmor version: one bump moves hook rev and binary together.
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.30.1
    hooks:
      - id: zizmor
        args:
          - --no-progress
          - --config
          - .github/zizmor.yml
          - --min-severity
          - high
          - .github/workflows/
  # Type-coverage ratchet: pyrefly_errors.json holds the baseline; new errors
  # fail CI (--error-stale-baseline). Routine pay-down: fix errors, then prune
  # the baseline with `uv run pyrefly check --prune-baseline` (drops only
  # entries that no longer fire). Reserve --update-baseline for an intentional
  # full reset — it regenerates from current diagnostics and would silently
  # absorb any new error present at the time.
  # Runs on 3.12 with the project venv on its path: the baseline is
  # interpreter-sensitive (aiosendspin/pyflac exist only on 3.12; bokeh/
  # pytest/lifx_emulator come from the synced project venv), so the error set
  # must be generated and checked in the same environment as the lint gate.
  - repo: local
    hooks:
      - id: pyrefly
        name: pyrefly (type ratchet)
        entry: uv run --python 3.12 --group dev --with pyrefly pyrefly check --error-stale-baseline
        language: system
        pass_filenames: false
        require_serial: true
