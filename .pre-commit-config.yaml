# Run with prek: `uv run prek run --all-files`, or `uv run prek install` for a
# git hook. `repo: builtin` hooks are prek-only (plain pre-commit can't run them).
# ledfx_frontend/ is a built bundle: whitespace there can sit inside JS strings.
exclude: ^ledfx_frontend/
repos:
  - repo: builtin
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: trailing-whitespace
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.4
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  # Structural check that ClassVar annotations describe their literals.
  # Ruff's RUF012 cannot see this (it only asks that an annotation exist).
  # language: python lets prek provision the interpreter via its uv
  # integration: no python(3) on PATH needed (Windows, uv-only setups),
  # and it works in CI where the project venv is not synced.
  - repo: local
    hooks:
      - id: classvar-audit
        name: classvar audit
        entry: python tools/classvar_audit.py
        language: python
        types: [python]
        pass_filenames: false
        require_serial: true
  # GitHub Actions security audit. Config in .github/zizmor.yml; the gate
  # is --min-severity high (informational findings stay advisory).
  - repo: local
    hooks:
      - id: zizmor
        name: zizmor
        entry: uvx zizmor --no-progress --config .github/zizmor.yml --min-severity high .github/workflows/
        language: system
        files: ^\.github/workflows/
        pass_filenames: false
