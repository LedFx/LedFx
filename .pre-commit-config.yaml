# Run with prek: `uv run prek run --all-files`, or `uv run prek install` for a
# git hook. `repo: builtin` hooks are prek-only (plain pre-commit can't run them).
# ledfx_frontend/ and the vendored Scalar bundle are built files: whitespace
# there can sit inside JS strings, and the Scalar bundle must match its sha256.
exclude: ^(ledfx_frontend/|ledfx/api/v2/docs/scalar\.standalone\.js$)
repos:
  - repo: builtin
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: trailing-whitespace
  # ruff runs from the locked version (uv.lock, bumped by Renovate) rather than
  # ruff-pre-commit's own rev, so there is a single ruff pin. Needs
  # `uv` on PATH (CI and the shared autofix workflow install it). Args and
  # filters match ruff-pre-commit.
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --frozen --only-group dev ruff check --force-exclude
        args: [--fix]
        language: system
        types_or: [python, pyi, jupyter]
        require_serial: true
      - id: ruff-format
        name: ruff format
        entry: uv run --frozen --only-group dev ruff format --force-exclude
        language: system
        types_or: [python, pyi, jupyter, markdown]
        require_serial: true
  # Structural check that ClassVar annotations describe their literals.
  # Ruff's RUF012 cannot see this (it only asks that an annotation exist).
  # language: python lets prek provision the interpreter via its uv
  # integration: no python(3) on PATH needed (Windows, uv-only setups),
  # and it works in CI where the project venv is not synced.
  - repo: local
    hooks:
      - id: classvar-audit
        name: classvar audit
        entry: python tools/classvar_audit.py
        language: python
        types: [python]
        pass_filenames: false
        require_serial: true
  # GitHub Actions security audit. Config in .github/zizmor.yml; the gate
  # is --min-severity high (informational findings stay advisory).
  # prek provisions zizmor itself (language: python), so no system tooling.
  # rev is the zizmor version: one bump moves hook rev and binary together.
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.30.1
    hooks:
      - id: zizmor
        args:
          - --no-progress
          - --config
          - .github/zizmor.yml
          - --min-severity
          - high
          - .github/workflows/
  # Workflow syntax, expressions, job graph and inline shell. A PR that only
  # changes workflows (other than ci.yml) runs lint alone, so this is its check.
  # actionlint and shellcheck run from the locked dev group (uv.lock, bumped by
  # Renovate), like ruff, so there is one pin each and shellcheck is on PATH
  # locally as on the CI runner.
  - repo: local
    hooks:
      - id: actionlint
        name: actionlint
        entry: uv run --frozen --only-group dev actionlint
        language: system
        files: ^\.github/workflows/
        require_serial: true
  # Type-coverage ratchet: pyrefly_errors.json holds the baseline; new errors
  # fail CI (--error-stale-baseline). Routine pay-down: fix errors, then prune
  # the baseline with `uv run --isolated --locked --python 3.12 --group dev python
  # tools/pyrefly_check.py --prune-baseline`. This drops fixed errors
  # without adding new ones; never use --update-baseline to "make CI pass".
  # Select both the locked environment and the interpreter Pyrefly queries.
  # Launching its binary alone can discover an unrelated .venv instead.
  - repo: https://github.com/facebook/pyrefly-pre-commit
    rev: 1.3.1
    hooks:
      - id: pyrefly-check
        entry: uv run --isolated --locked --python 3.12 --group dev python tools/pyrefly_check.py
        args: [--error-stale-baseline]
        language: system
        pass_filenames: false
