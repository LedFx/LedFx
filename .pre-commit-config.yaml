# Run with prek: `uv run prek run --all-files`, or `uv run prek install` for a
# git hook. `repo: builtin` hooks are prek-only (plain pre-commit can't run them).
# ledfx_frontend/ is a built bundle: whitespace there can sit inside JS strings.
exclude: ^ledfx_frontend/
repos:
  - repo: builtin
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: trailing-whitespace
  # ruff runs from the locked version (uv.lock, bumped by Renovate) rather than
  # ruff-pre-commit's own rev, so there is a single ruff pin. Needs
  # `uv` on PATH (CI and the shared autofix workflow install it). Args and
  # filters match ruff-pre-commit.
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --frozen --only-group dev ruff check --force-exclude
        args: [--fix]
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: ruff-format
        name: ruff format
        entry: uv run --frozen --only-group dev ruff format --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true
  # Structural check that ClassVar annotations describe their literals.
  # Ruff's RUF012 cannot see this (it only asks that an annotation exist).
  # language: python lets prek provision the interpreter via its uv
  # integration: no python(3) on PATH needed (Windows, uv-only setups),
  # and it works in CI where the project venv is not synced.
  - repo: local
    hooks:
      - id: classvar-audit
        name: classvar audit
        entry: python tools/classvar_audit.py
        language: python
        types: [python]
        pass_filenames: false
        require_serial: true
  # GitHub Actions security audit. Config in .github/zizmor.yml; the gate
  # is --min-severity high (informational findings stay advisory).
  # prek provisions zizmor itself (language: python), so no system tooling.
  # rev is the zizmor version: one bump moves hook rev and binary together.
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.30.1
    hooks:
      - id: zizmor
        args:
          - --no-progress
          - --config
          - .github/zizmor.yml
          - --min-severity
          - high
          - .github/workflows/
