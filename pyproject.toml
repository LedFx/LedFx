name = "LedFx"
version = "2.2.0"
description = "A network based light effect controller"
readme = "README.rst"

[dependency-groups]
dev = [
    "python-osc>=1.8.3",  # Independent OSC wire oracle for adapter tests
    "bokeh<4.0.0,>=3.3.3",
    "pytest>=8.0.0,<10.0.0",
    "pytest-asyncio>=1.4.0,<1.5.0",
    "pytest-order<2.0.0,>=1.2.0",
    "pytest-timeout>=2.3.0,<3.0.0",
    "lifx-emulator-core>=3.8.0",
    "prek>=0.5.3",
    "ruff==0.16.8",
    "pyrefly==1.3.1",
    "actionlint-py==1.7.12.24",
    "shellcheck-py==0.11.0.1",
    "openapi-spec-validator>=0.9.0",
    "schemathesis>=4,<5",
]
build = ["pyinstaller<7.0.0,>=6.3.0"]
docs = [
    "sphinx<9.1.1",
    "sphinxcontrib-websupport==2.0.0",
    "sphinxcontrib-httpdomain==2.0.0",
    "sphinx-autodoc-typehints==3.5.2",
    "sphinx-autodoc-annotation==1.0-1",
    "sphinx-autobuild",
    "sphinx-rtd-theme==3.1.0",
    "sphinx-toolbox==4.3.1",
    "rstcheck==6.3.0",
    "sphinx-copybutton==0.5.2",
    "myst-parser>=3.0.1",
    "linkify-it-py>=2.0.3",
    "sphinxcontrib-mermaid",
]

[tool.pdm.build]
excludes = ["**/.pdm-build/**", "**/__pycache__/**", "**/.pytest_cache/**"]
includes = [
    "ledfx",
    "ledfx_frontend",
    "ledfx_assets",
    "loopback",
    "README.rst",
    "AUTHORS.rst",
    "CHANGELOG.rst",
    "LICENSE.txt",
    "ledfx.env",
]
[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"


[project.optional-dependencies]
hue = []

[project.scripts]
ledfx = "ledfx.__main__:main"
ledfx-loopback-install = "loopback.__main__:copy_lib"
[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["dist", "build", ".tox"]
filterwarnings = "ignore::DeprecationWarning"
asyncio_default_fixture_loop_scope = "function"
asyncio_mode = "auto"
timeout = 30

[tool.uv]
# 0.12.12 is the first release that also keeps files uploaded after the
# exclude-newer cutoff out of uv.lock. Renovate and setup-uv both read this.
required-version = ">=0.12.12"
# Match Renovate's 14-day minimumReleaseAge (LedFx/renovate-config), including
# for lock file maintenance, which Renovate does not delay. For an urgent
# security fix newer than this, exempt the package below until it ages in.
exclude-newer = "14 days"
# Our own packages: released and reviewed by us, so no wait.
exclude-newer-package = { ledfx-senders = false, aubio-ledfx = false, pyfastnoiselite-ledfx = false, samplerate-ledfx = false }
# We want to use copy here, since symlink mode means we can't use our own portaudio dll
# A bit slower, but it works for our use case
link-mode = "copy"
default-groups = []
# The sender is distributed separately; never bootstrap Rust in the application.
no-build-package = ["ledfx-senders"]
# cryptography 49 dropped x86_64 macOS. Built from source there it links
# Homebrew's libssl.3.dylib, which clashes with Python's own libssl in the
# frozen macOS Intel app (ImportError: SSL_get0_group_name). 48.0.1 is the
# last release with Intel wheels (OpenSSL statically linked). Only LedFx's
# lock and builds see this; pip installs are unaffected.
constraint-dependencies = [
    "cryptography<49; sys_platform == 'darwin' and platform_machine == 'x86_64'",
]

[tool.ruff.lint]
# ruff's defaults, plus: no f-strings in logging calls (format lazily).
# Pre-existing violations are baselined with `# noqa`; fix them as you go.
extend-select = ["G004"]

[tool.pyrefly]
# Require complete annotations and reject unsafe uses of Any.
preset = "strict"
# Match CI so diagnostics do not depend on the contributor's OS.
python-platform = "linux"
# Run via tools/pyrefly_check.py in the locked Python 3.12 dev environment.
# Existing errors are baselined; new errors must be fixed.
project-includes = [
    "ledfx",
    "tests",
    "docs",
]
project-excludes = [
    "ledfx_frontend",
]

# Type-coverage ratchet: existing errors live in pyrefly_errors.json, checked
# in the locked project environment so CI, weekly maintenance, and local
# checks see the same diagnostics. New errors fail CI; routine pay-down prunes
# fixed entries with --prune-baseline; --update-baseline is for full resets.
baseline = "pyrefly_errors.json"

[tool.pyrefly.errors]
# Platform-specific optional imports are not present in every locked
# environment, so missing-import diagnostics remain outside this ratchet.
missing-import = "ignore"
# Keep Any from bypassing the strict checker; use object or a concrete type.
explicit-any = "error"


[tool.release-ci]
github-distributions = false
assets = [
    "LedFx-{tag_version}-win-x64.zip",
    "LedFx-{tag_version}-win-x64-setup.zip",
    "LedFx-{tag_version}-osx-arm64.tar.gz",
    "LedFx-{tag_version}-osx-intel.tar.gz",
]

[[tool.release-ci.oci]]
image = "ghcr.io/ledfx/ledfx"
platforms = ["linux/amd64", "linux/arm64"]
promote-latest = true

[[tool.release-ci.oci]]
image = "docker.io/ledfxorg/ledfx"
platforms = ["linux/amd64", "linux/arm64"]
promote-latest = true
