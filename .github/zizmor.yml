# zizmor configuration for LedFx workflows.
#
# The lint gate runs zizmor with --min-severity high --persona=auditor:
# findings below `high` are advisory, not gate failures.
#
# Scope notes:
# - superfluous-actions: the maintainers' choice of release action; zizmor's
#   suggestion to replace it with `gh release` is not this repo's bar.
# - dangerous-triggers/lint-notify.yml: that workflow is the reviewed, safe
#   shape of workflow_run — the default-branch version always executes, it
#   never checks out or executes PR code, and PR-controlled values only ever
#   reach `gh` as API arguments. See the comment block at the top of the
#   workflow for the full argument.
rules:
  superfluous-actions:
    disable: true
  dangerous-triggers:
    ignore:
      - lint-notify.yml
  secrets-outside-env:
    # Deliberate, not an oversight:
    # - ci.yml (docker / docker-edge): these jobs run on every PR, and any
    #   environment with protection rules (production has required reviewers
    #   plus a branch policy) would block or reject those builds. The Hub
    #   login step is gated on PUBLISH, so fork PRs never touch the creds.
    # - lint-notify.yml: AUTOMATION_APP_* is a comment-only app token minted
    #   per run; there is no environment worth gating a notification behind.
    ignore:
      - ci.yml
      - lint-notify.yml
