# zizmor configuration for LedFx workflows.
# Threshold: findings below `high` severity are advisory, not gate failures
# (enforced with --min-severity high in the lint gate).
rules:
  # The maintainers' choice of release action; zizmor's informational
  # suggestion to replace it with `gh release` is not this repo's bar.
  superfluous-actions:
    disable: true
  # lint-notify.yml is the reviewed, safe shape of workflow_run: the default-
  # branch version always executes, it never checks out or executes PR code,
  # and PR-controlled values never reach a run block. See the comment block
  # at the top of that workflow for the full argument.
  dangerous-triggers:
    ignore:
      - lint-notify.yml
