name: autofix.ci # must be exactly this: autofix.ci identifies the workflow by name

on:
  pull_request:

permissions:
  contents: read

# A new push makes the running fix obsolete.
concurrency:
  group: autofix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  autofix:
    # Pinned to the unmerged LedFx/.github PR; repinned to main after it merges.
    uses: LedFx/.github/.github/workflows/autofix.yml@1a8ccef5a72d29f75e2d4c9a747857c2222e02f0 # main
