name: autofix.ci # must be exactly this: autofix.ci identifies the workflow by name

on:
  pull_request:

permissions:
  contents: read

# A new push makes the running fix obsolete.
concurrency:
  group: autofix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  autofix:
    uses: LedFx/.github/.github/workflows/autofix.yml@3eb9a4add4179f6a7594ca06da294811a0c221d5 # main
