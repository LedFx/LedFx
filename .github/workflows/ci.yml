name: CI

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel main or tag runs: they publish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  UV_PYTHON: "3.12" # frozen builds, wheel; test jobs override
  GHCR_IMAGE: ghcr.io/ledfx/ledfx
  DOCKERHUB_IMAGE: ledfxorg/ledfx

jobs:
  # Decides which jobs a PR needs, here rather than with paths-ignore: a
  # workflow skipped by paths-ignore never reports, so the required "CI passed"
  # check would wait forever. Skipped jobs count as passed. Pushes (main,
  # tags) and manual runs always run everything.
  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read  # reads PR metadata (changed paths) to decide which jobs run
    outputs:
      code: ${{ steps.plan.outputs.code }} # lint
      tests: ${{ steps.plan.outputs.tests }} # Linux tests
      platform: ${{ steps.plan.outputs.platform }} # Windows tests, macOS smoke
      build: ${{ steps.plan.outputs.build }} # package, frozen builds, Docker
      pythons: ${{ steps.plan.outputs.pythons }} # Linux test matrix
      version: ${{ steps.plan.outputs.version }}
      release: ${{ steps.plan.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: pyproject.toml
          sparse-checkout-cone-mode: false
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref }}
          EVENT: ${{ github.event_name }}
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          # PR-controlled on PR runs; it ends up in outputs, file names and NSIS defines.
          if [[ ! "$version" =~ ^[0-9][0-9A-Za-z.+-]*$ ]]; then
            echo "::error::Unexpected version string in pyproject.toml"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # The one guard for every publish path.
          if [[ "$REF" == refs/tags/v* && "$REF" != "refs/tags/v$version" ]]; then
            echo "::error::Tag ${REF#refs/tags/} does not match pyproject.toml version $version"
            exit 1
          fi
          # Only a tag push releases; re-run failed jobs to retry a release.
          if [[ "$EVENT" == push && "$REF" == refs/tags/v* ]]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi
          code=true tests=true platform=true build=true
          pythons='["3.11", "3.12", "3.13", "3.14"]'
          if [ -n "$PR" ]; then
            # previous_filename: moving code out of ledfx/ into docs/ is still a code change
            files=$(gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[] | .filename, (.previous_filename // empty)')
            # here-string, not a pipe: grep -q exiting early + pipefail would read as "no match"
            # docs/**/*.py is type-checked by the Pyrefly lint hook, so it counts as code.
            grep -qvE '^(frontend|docs|ledfx_frontend)/' <<< "$files" \
              || grep -qE '^docs/.*\.py$' <<< "$files" || code=false
            # A change to this workflow runs all of it.
            if ! grep -qx '.github/workflows/ci.yml' <<< "$files"; then
              # Repo metadata (other workflows, bot and editor config, top-level
              # prose) is checked by lint (actionlint, zizmor); nothing to test.
              meta='^(frontend/|docs/|ledfx_frontend/|\.github/|\.vscode/|renovate\.json$|release-please-config\.json$|\.release-please-manifest\.json$|\.readthedocs\.yml$|\.gitignore$|\.git-blame-ignore-revs$|[^/]+\.(md|rst|txt)$)'
              grep -qvE "$meta" <<< "$files" || tests=false
              # Tests alone can't break a build.
              grep -qvE "$meta|^tests/" <<< "$files" || build=false
              # Mid-stack (another open PR here builds on this branch): lint
              # and Linux tests on the oldest and newest Python. The top of a
              # stack (based on another PR's branch, nothing on top) runs
              # everything: its files are one layer, its tree is the stack's.
              # A plain assignment, so a failed query fails this step (bash -e)
              # and with it CI passed, rather than reading as "stacked on".
              above=0
              if [ "$HEAD_REPO" = "$REPO" ]; then
                above=$(gh api -X GET "repos/$REPO/pulls" -f state=open -f base="$HEAD_REF" --jq length)
              fi
              if [ "$above" != 0 ]; then
                platform=false build=false
                pythons='["3.11", "3.14"]'
              elif [ "$BASE_REF" != main ]; then
                code=true tests=true platform=true build=true
              fi
            fi
          fi
          [ "$code" = true ] || tests=false
          [ "$tests" = true ] || platform=false
          [ "$code" = true ] || build=false
          {
            echo "code=$code"
            echo "tests=$tests"
            echo "platform=$platform"
            echo "build=$build"
            echo "pythons=$pythons"
          } >> "$GITHUB_OUTPUT"

  # Fast lint gate before any build/test spend. Runs the same prek hook set
  # contributors see locally (`uv run prek run --all-files`), so CI cannot
  # drift from the dev experience. autofix.ci runs in parallel and pushes
  # fixes; that push re-triggers this workflow. A lint failure skips every
  # code job below (skipped jobs count as passed for the required check).
  lint:
    name: Lint (prek)
    needs: plan
    if: needs.plan.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: ${{ needs.plan.outputs.release != 'true' }} # zizmor: ignore[cache-poisoning] off on release runs
      - run: uv sync --group dev
      - id: lint
        run: uv run prek run --all-files
      # Failure notification happens in lint-notify.yml (trusted workflow_run
      # context): fork PRs get a read-only token here and org secrets are not
      # injected into this workflow at all, so it stays credential-free.

  # The committed /api/v2 contract. openapi/ledfx-v2.json is generated in one
  # canonical environment (Linux, Python 3.12 from UV_PYTHON, every extra), so
  # only this job runs the drift test. oasdiff then compares it with the base
  # branch's copy; the api-break label skips that comparison.
  openapi:
    name: OpenAPI spec
    needs: [plan, lint]
    if: needs.plan.outputs.tests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read  # reads the PR's labels at run time (api-break)
    env:
      LEDFX_CANONICAL_SPEC: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y gcc libatlas3-base portaudio19-dev
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: ${{ needs.plan.outputs.release != 'true' }} # zizmor: ignore[cache-poisoning] off on release runs
      - name: Install LedFx
        env:
          CFLAGS: -Wno-incompatible-function-pointer-types
        run: uv sync --all-extras --dev
      # --noconftest: these tests need no running LedFx or LIFX emulator.
      - name: Committed spec is current and passes the lint
        run: |
          set -o pipefail  # the default `bash -e` would take tee's status
          uv run pytest -v -rs --noconftest --timeout=120 tests/api_v2/test_committed_spec.py tests/api_v2/test_spec_lint.py | tee pytest.log
          # A skip means LEDFX_CANONICAL_SPEC drifted from the test: fail, don't go green.
          if grep -Eq '[0-9]+ skipped' pytest.log; then echo "::error::spec tests were skipped"; exit 1; fi
      - name: Fetch the base branch's spec
        id: base
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          # Read live, not from the event: re-running this job after adding
          # the label then takes effect.
          labels=$(gh api "repos/$REPO/pulls/$PR" --jq '.labels[].name')
          if grep -qx api-break <<< "$labels"; then
            echo "::notice::api-break label: skipping the breaking-change check"
            exit 0
          fi
          git fetch --depth=1 origin "$BASE_REF"
          if git show FETCH_HEAD:openapi/ledfx-v2.json > base-spec.json 2>/dev/null; then
            echo "check=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::$BASE_REF has no openapi/ledfx-v2.json yet: nothing to compare"
          fi
      - name: No breaking API changes
        if: steps.base.outputs.check == 'true'
        uses: oasdiff/oasdiff-action/breaking@5e81b5c380accc6b523f9d32a637ca630e33620b # v0.1.17
        with:
          base: base-spec.json
          revision: openapi/ledfx-v2.json
          fail-on: ERR
          review: false # never upload the specs to oasdiff.com
          github-token: "" # no PR comment

  test-linux:
    name: Test (Ubuntu, py${{ matrix.python }})
    needs: [plan, lint]
    if: needs.plan.outputs.tests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ${{ fromJSON(needs.plan.outputs.pythons) }}
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y gcc libatlas3-base portaudio19-dev
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: ${{ needs.plan.outputs.release != 'true' }} # zizmor: ignore[cache-poisoning] off on release runs
      - name: Install LedFx
        env:
          CFLAGS: -Wno-incompatible-function-pointer-types
        run: uv sync --all-extras --dev
      - uses: LABSN/sound-ci-helpers@d08c889a7bba7d9b1b059f8f76dac4672ea3a9cf # v1.0.4
      - name: Create audio input
        run: pactl load-module module-null-sink sink_name=LedFx_Test_Source sink_properties=device.description=LedFx_Test_Source
      - name: Run tests
        run: uv run pytest -v --timeout=120
        timeout-minutes: 10
        env:
          LEDFX_TEST_CONFIG_DIR: ${{ runner.temp }}/ledfx-test
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: ledfx-log-linux-py${{ matrix.python }}
          path: ${{ runner.temp }}/ledfx-test/*.log

  test-windows:
    name: Test (Windows, py${{ matrix.python }})
    needs: [plan, lint]
    if: needs.plan.outputs.platform == 'true'
    runs-on: windows-2022 # pinned until we understand why windows-2025 has audio device issues
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"] # oldest and newest supported
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - name: Enable long paths for git
        run: git config --system core.longpaths true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: ${{ needs.plan.outputs.release != 'true' }} # zizmor: ignore[cache-poisoning] off on release runs
      - name: Install LedFx
        run: uv sync --all-extras --dev
      - uses: LABSN/sound-ci-helpers@d08c889a7bba7d9b1b059f8f76dac4672ea3a9cf # v1.0.4
      # The LIFX emulator (tests/conftest.py) binds UDP 56700, inside Windows'
      # dynamic port range. winnat reserves random blocks of that range at
      # boot; when one covers 56700 the bind fails with WinError 10013.
      # Reserve the port while winnat is stopped so it can't be taken.
      - name: Reserve UDP 56700 for the LIFX emulator
        run: |
          net stop winnat
          netsh int ipv4 add excludedportrange protocol=udp startport=56700 numberofports=1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          net start winnat
          netsh int ipv4 show excludedportrange protocol=udp
      - name: Run tests
        run: uv run pytest -v --timeout=120
        timeout-minutes: 10
        env:
          LEDFX_TEST_CONFIG_DIR: ${{ runner.temp }}/ledfx-test
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: ledfx-log-windows-py${{ matrix.python }}
          path: ${{ runner.temp }}/ledfx-test/*.log

  test-macos:
    name: Smoke test (macOS arm64, py${{ matrix.python }})
    needs: [plan, lint]
    if: needs.plan.outputs.platform == 'true'
    runs-on: macos-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"] # oldest and newest supported
    env:
      UV_PYTHON: ${{ matrix.python }}
      CFLAGS: -Wno-incompatible-function-pointer-types
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install system dependencies
        run: brew install portaudio mbedtls@2
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: ${{ needs.plan.outputs.release != 'true' }} # zizmor: ignore[cache-poisoning] off on release runs
      - name: Install LedFx
        run: |
          mbedtls=$(brew --prefix mbedtls@2)
          export PATH="$mbedtls/bin:$PATH" LDFLAGS="-L$mbedtls/lib" CPPFLAGS="-I$mbedtls/include"
          uv sync --all-extras --dev
      - name: Check LedFx launches
        run: uv run ledfx --ci-smoke-test -vv -c debug_config --offline
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: ledfx-log-macos-py${{ matrix.python }}
          path: debug_config/ledfx.log

  frozen-windows:
    name: Frozen build (Windows)
    needs: [plan, lint]
    if: needs.plan.outputs.build == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Enable long paths for git
        run: git config --system core.longpaths true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: ${{ needs.plan.outputs.release != 'true' }} # zizmor: ignore[cache-poisoning] off on release runs
      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis
          echo "C:\Program Files (x86)\NSIS\Bin" | Out-File -FilePath "$env:GITHUB_PATH" -Append
          echo "C:\Program Files (x86)\NSIS" | Out-File -FilePath "$env:GITHUB_PATH" -Append
      - name: Install LedFx
        run: uv sync --extra hue --group build
      - name: Build binary
        run: uv run pyinstaller windows-binary.spec
      - name: Swap in WASAPI loopback portaudio
        run: mv -f loopback/libportaudio64bit.dll dist/LedFx/_internal/_sounddevice_data/portaudio-binaries/libportaudio64bit.dll
      - name: Build installer # ledfx.nsi packs dist\LedFx, so package after this
        run: cd installer && makensis //DPRODUCT_VERSION="$VERSION" ledfx.nsi
      - name: Package release archives
        run: |
          mv dist/LedFx "dist/LedFx-$VERSION"
          (cd dist && 7z a "../LedFx-$VERSION-win-x64.zip" "LedFx-$VERSION")
          mv "installer/ledfx-setup-win-$VERSION.exe" "LedFx-$VERSION-setup.exe"
          7z a "LedFx-$VERSION-win-x64-setup.zip" "LedFx-$VERSION-setup.exe"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-win-x64
          path: LedFx-${{ env.VERSION }}-win-x64*.zip
          if-no-files-found: error
          compression-level: 0

  frozen-macos:
    name: Frozen build (macOS ${{ matrix.suffix }})
    needs: [plan, lint]
    if: needs.plan.outputs.build == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: &macos
          - runner: macos-15-intel
            suffix: osx-intel
          - runner: macos-latest
            suffix: osx-arm64
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      SUFFIX: ${{ matrix.suffix }}
      CFLAGS: -Wno-incompatible-function-pointer-types
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install system dependencies
        run: brew install portaudio mbedtls@2
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: ${{ needs.plan.outputs.release != 'true' }} # zizmor: ignore[cache-poisoning] off on release runs
      - name: Install LedFx
        run: |
          mbedtls=$(brew --prefix mbedtls@2)
          export PATH="$mbedtls/bin:$PATH" LDFLAGS="-L$mbedtls/lib" CPPFLAGS="-I$mbedtls/include"
          uv sync --extra hue --group build
      - name: Build binary
        run: uv run pyinstaller osx-binary.spec
      # tar here: upload-artifact drops the permissions and symlinks an .app needs
      - name: Package release archive
        run: |
          chmod +x dist/LedFx/Contents/MacOS/LedFx
          mv dist/LedFx "dist/LedFx-$VERSION.app"
          xattr -cr "dist/LedFx-$VERSION.app"
          tar -C dist -czf "LedFx-$VERSION-$SUFFIX.tar.gz" "LedFx-$VERSION.app"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.suffix }}
          path: LedFx-${{ env.VERSION }}-${{ matrix.suffix }}.tar.gz
          if-no-files-found: error
          compression-level: 0

  # Clean runners on purpose: they catch libraries missing from the bundle
  # that the build runner happens to have installed.
  smoke-windows:
    name: Smoke test frozen build (Windows)
    needs: [plan, lint, frozen-windows]
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: LABSN/sound-ci-helpers@d08c889a7bba7d9b1b059f8f76dac4672ea3a9cf # v1.0.4
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-win-x64
      - name: Run LedFx
        run: |
          7z x "LedFx-$VERSION-win-x64.zip"
          "LedFx-$VERSION/LedFx.exe" -vv --ci-smoke-test --offline
      # //S: Git Bash would rewrite /S as a path. The second install runs over
      # a running LedFx, which the installer must close rather than half-replace.
      - name: Install, then upgrade over a running LedFx
        run: |
          7z x "LedFx-$VERSION-win-x64-setup.zip"
          dir="/c/Program Files/LedFx"
          "./LedFx-$VERSION-setup.exe" //S
          "$dir/LedFx.exe" -vv --ci-smoke-test --offline
          "$dir/LedFx.exe" --offline > ledfx-running.log 2>&1 &
          pid=$!
          sleep 20
          kill -0 "$pid" || { echo "::error::LedFx exited before the upgrade"; cat ledfx-running.log; exit 1; }
          "./LedFx-$VERSION-setup.exe" //S
          "$dir/LedFx.exe" -vv --ci-smoke-test --offline
      # _?= makes the uninstaller run in place, so -Wait waits for it. It must be
      # last and unquoted, which Git Bash can't pass.
      - name: Uninstall
        shell: pwsh
        run: |
          $dir = "C:\Program Files\LedFx"
          $p = Start-Process -Wait -PassThru "$dir\uninst.exe" -ArgumentList "/S _?=$dir"
          if ($p.ExitCode -ne 0 -or (Test-Path "$dir\_internal") -or (Test-Path "$dir\LedFx.exe")) { exit 1 }

  smoke-macos:
    name: Smoke test frozen build (macOS ${{ matrix.suffix }})
    needs: [plan, lint, frozen-macos]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include: *macos
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      SUFFIX: ${{ matrix.suffix }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-${{ matrix.suffix }}
      - name: Run LedFx
        run: |
          tar -xzf "LedFx-$VERSION-$SUFFIX.tar.gz"
          "./LedFx-$VERSION.app/Contents/MacOS/LedFx" -vv --ci-smoke-test --offline

  package:
    name: Build Python package
    needs: [plan, lint]
    if: needs.plan.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: ${{ needs.plan.outputs.release != 'true' }} # zizmor: ignore[cache-poisoning] off on release runs
      - name: Write ledfx.env
        env:
          RELEASE: ${{ needs.plan.outputs.release }}
        run: |
          echo "GITHUB_SHA = \"$GITHUB_SHA\"" >> ledfx.env
          echo "IS_RELEASE = $RELEASE" >> ledfx.env
      - name: Build wheel and sdist
        run: uv build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-dist
          path: dist/
          if-no-files-found: error

  smoke-package:
    name: Smoke test Python package (${{ matrix.kind }})
    needs: [plan, lint, package]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        kind: [whl, tar.gz]
    env:
      KIND: ${{ matrix.kind }}
    steps:
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y portaudio19-dev
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-dist
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: false
      - name: Install and run LedFx
        run: |
          uv venv
          uv pip install ledfx-*."$KIND"
          .venv/bin/ledfx -vv --ci-smoke-test --offline

  docker:
    name: Docker (${{ matrix.arch }})
    needs: [plan, lint]
    if: needs.plan.outputs.build == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    # NOTE: deliberately no environment here. This job runs on PRs;
    # an environment with protection rules (production has required
    # reviewers + a branch policy) would block or reject PR builds. The
    # Docker Hub login step is gated on PUBLISH, so fork PRs never touch
    # the credentials.
    permissions:
      contents: read
      packages: write  # pushes the built image to GHCR
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      ARCH: ${{ matrix.arch }}
      # push events are only main and v* tags; forks never publish
      PUBLISH: ${{ github.event_name == 'push' && github.repository == 'LedFx/LedFx' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Log in to Docker Hub
        if: env.PUBLISH == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ledfx_docker/Dockerfile
          platforms: linux/${{ matrix.arch }}
          load: true
          provenance: false
          tags: ledfx:ci
          # Release builds never touch a cache: a tag run can read caches written on main.
          no-cache: ${{ needs.plan.outputs.release == 'true' }}
          cache-from: ${{ needs.plan.outputs.release != 'true' && format('type=registry,ref={0}:cache-{1}', env.GHCR_IMAGE, matrix.arch) || '' }}
          cache-to: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && format('type=registry,ref={0}:cache-{1},mode=max', env.GHCR_IMAGE, matrix.arch) || '' }}
          build-args: |
            GITHUB_SHA=${{ github.sha }}
            IS_RELEASE=${{ needs.plan.outputs.release }}
      - name: Smoke test
        run: docker run --rm ledfx:ci --ci-smoke-test -vv --offline
      - name: Push the tested image
        if: env.PUBLISH == 'true'
        run: |
          for image in "$GHCR_IMAGE" "$DOCKERHUB_IMAGE"; do
            # Only main moves edge: a tag on an older commit would roll it back
            if [[ "$GITHUB_REF" == refs/heads/main ]]; then
              docker tag ledfx:ci "$image:edge-$ARCH"
              docker push "$image:edge-$ARCH"
            fi
            docker tag ledfx:ci "$image:edge-$ARCH-$GITHUB_SHA"
            digest=$(docker push "$image:edge-$ARCH-$GITHUB_SHA" | awk '/digest: sha256:/ {print $3}')
            test -n "$digest"
            echo "$image@$digest" >> "docker-$ARCH.txt"
          done
      # Releases promote these digests, not the edge tags: a main run of the
      # same commit may retag those with a cached image while approval waits.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: env.PUBLISH == 'true'
        with:
          name: docker-${{ matrix.arch }}
          path: docker-${{ matrix.arch }}.txt
          if-no-files-found: error

  docker-edge:
    name: Docker edge manifest
    needs: [plan, ci-passed]
    # Tag runs publish through publish-release; moving edge there could roll it
    # back to an older commit.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'LedFx/LedFx'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      packages: write  # pushes the merged edge manifest to GHCR
    steps:
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Create edge manifests
        run: |
          for image in "$GHCR_IMAGE" "$DOCKERHUB_IMAGE"; do
            docker buildx imagetools create -t "$image:edge" -t "$image:edge-$GITHUB_SHA" \
              "$image:edge-amd64-$GITHUB_SHA" "$image:edge-arm64-$GITHUB_SHA"
          done

  # The one check branch protection requires. Every build/test job belongs in
  # needs; its name must never change.
  ci-passed:
    name: CI passed
    if: always()
    needs:
      - plan
      - lint
      - openapi
      - test-linux
      - test-windows
      - test-macos
      - frozen-windows
      - frozen-macos
      - smoke-windows
      - smoke-macos
      - package
      - smoke-package
      - docker
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail if any job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1

  # Release-please has already created the tag, changelog and draft. Promote
  # tested artifacts in one production job, then publish GitHub LAST with the
  # App token: release:published can now start independent notifications after
  # every distribution is ready. Sentry keeps the same approval dependencies.
  publish-release:
    name: Publish verified release
    needs: [plan, ci-passed]
    if: >-
      !cancelled() && needs.plan.result == 'success' && needs.ci-passed.result == 'success' &&
      needs.plan.outputs.release == 'true' && github.repository == 'LedFx/LedFx' &&
      github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: release-publication
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      id-token: write  # PyPI Trusted Publishing and Sigstore provenance signing
      packages: write  # promotes tested GHCR image digests
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          merge-multiple: true
          path: release-assets/
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-dist
          path: dist/
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: docker-*
          merge-multiple: true
          path: docker-digests/
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: .github
          path: release-tools
      - name: Mint the publication token
        id: release-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.AUTOMATION_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-attestations: write
      - name: Verify release identity and existing artifacts
        id: prepare
        env:
          GH_TOKEN: ${{ steps.release-token.outputs.token }}
        uses: LedFx/release-ci/actions/release@f57f5eced6c74aadb1d432fc349554212d7cf05f # reviewed shared transaction
        with:
          phase: prepare
          policy: release-tools/.github/release-policy.json
          assets: release-assets
          dist: dist
          docker-digests: docker-digests
          snapshot: ${{ runner.temp }}/release-snapshot.json
      - name: Attest release archives and Python distributions
        id: file-provenance
        if: steps.prepare.outputs.already_published != 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            ${{ github.workspace }}/release-assets/*
            ${{ github.workspace }}/dist/*
          create-storage-record: false
          github-token: ${{ steps.release-token.outputs.token }}
      - name: Recheck immutable inputs before PyPI upload
        id: upload
        env:
          GH_TOKEN: ${{ steps.release-token.outputs.token }}
        uses: LedFx/release-ci/actions/release@f57f5eced6c74aadb1d432fc349554212d7cf05f # reviewed shared transaction
        with:
          phase: check-upload
          policy: release-tools/.github/release-policy.json
          assets: release-assets
          dist: dist
          docker-digests: docker-digests
          snapshot: ${{ runner.temp }}/release-snapshot.json
      - name: Publish verified Python distributions
        if: steps.upload.outputs.pypi_upload == 'true'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          skip-existing: true  # Fresh shared checks require matching remote SHA-256.
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Verify PyPI and promote tested Docker digests
        id: promote
        env:
          GH_TOKEN: ${{ steps.release-token.outputs.token }}
        uses: LedFx/release-ci/actions/release@f57f5eced6c74aadb1d432fc349554212d7cf05f # reviewed shared transaction
        with:
          phase: promote
          policy: release-tools/.github/release-policy.json
          assets: release-assets
          dist: dist
          docker-digests: docker-digests
          snapshot: ${{ runner.temp }}/release-snapshot.json
      - name: Attest the promoted GHCR image
        id: ghcr-provenance
        if: steps.prepare.outputs.already_published != 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.GHCR_IMAGE }}
          subject-digest: ${{ fromJSON(steps.promote.outputs.image_digests)['ghcr.io/ledfx/ledfx'] }}
          push-to-registry: true
          create-storage-record: false
          github-token: ${{ steps.release-token.outputs.token }}
      - name: Attest the promoted Docker Hub image
        id: dockerhub-provenance
        if: steps.prepare.outputs.already_published != 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: docker.io/${{ env.DOCKERHUB_IMAGE }}
          subject-digest: ${{ fromJSON(steps.promote.outputs.image_digests)['docker.io/ledfxorg/ledfx'] }}
          push-to-registry: true
          create-storage-record: false
          github-token: ${{ steps.release-token.outputs.token }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && steps.prepare.outcome == 'success'
        with:
          name: provenance-${{ github.ref_name }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/release-snapshot.json
            ${{ steps.file-provenance.outputs.bundle-path }}
            ${{ steps.ghcr-provenance.outputs.bundle-path }}
            ${{ steps.dockerhub-provenance.outputs.bundle-path }}
          if-no-files-found: error
      - name: Verify provenance and publish the GitHub draft
        env:
          GH_TOKEN: ${{ steps.release-token.outputs.token }}
        uses: LedFx/release-ci/actions/release@f57f5eced6c74aadb1d432fc349554212d7cf05f # reviewed shared transaction
        with:
          phase: finalize
          policy: release-tools/.github/release-policy.json
          assets: release-assets
          dist: dist
          docker-digests: docker-digests
          snapshot: ${{ runner.temp }}/release-snapshot.json

  sentry:
    name: Notify Sentry of release
    needs: [plan, ci-passed]
    if: needs.plan.outputs.release == 'true'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Commit history for Sentry only; nothing is built.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: getsentry/action-release@ff07929a6537bac57790c3451cf4d364aca38528 # v3.7.0
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN_V2 }}
          SENTRY_ORG: ledfx-org
          SENTRY_PROJECT: ledfx-v2-rel
        with:
          environment: production
          release: ledfx@${{ needs.plan.outputs.version }}
