name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel main or tag runs: they publish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  UV_PYTHON: "3.12" # frozen builds, wheel; test jobs override
  GHCR_IMAGE: ghcr.io/ledfx/ledfx
  DOCKERHUB_IMAGE: ledfxorg/ledfx

jobs:
  # Docs/frontend-only PRs skip the builds here rather than with paths-ignore:
  # a workflow skipped by paths-ignore never reports, so the required
  # "CI passed" check would wait forever. Skipped jobs count as passed.
  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.plan.outputs.code }}
      version: ${{ steps.plan.outputs.version }}
      release: ${{ steps.plan.outputs.release }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          sparse-checkout: pyproject.toml
          sparse-checkout-cone-mode: false
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref }}
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # The one guard for every publish path.
          if [[ "$REF" == refs/tags/v* ]]; then
            if [[ "$REF" != "refs/tags/v$version" ]]; then
              echo "::error::Tag ${REF#refs/tags/} does not match pyproject.toml version $version"
              exit 1
            fi
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi
          code=true
          if [ -n "$PR" ]; then
            files=$(gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[].filename')
            # here-string, not a pipe: grep -q exiting early + pipefail would read as "no match"
            grep -qvE '^(frontend|docs|ledfx_frontend)/' <<< "$files" || code=false
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

  test-linux:
    name: Test (Ubuntu, py${{ matrix.python }})
    needs: plan
    if: needs.plan.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y gcc libatlas3-base portaudio19-dev
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: ${{ needs.plan.outputs.release != 'true' }} # zizmor: ignore[cache-poisoning] off on release runs
          cache-dependency-glob: uv.lock
      - name: Install LedFx
        env:
          CFLAGS: -Wno-incompatible-function-pointer-types
        run: uv sync --all-extras --dev
      - uses: LABSN/sound-ci-helpers@d08c889a7bba7d9b1b059f8f76dac4672ea3a9cf # v1.0.4
      - name: Create audio input
        run: pactl load-module module-null-sink sink_name=LedFx_Test_Source sink_properties=device.description=LedFx_Test_Source
      - name: Run tests
        run: uv run pytest -v --timeout=120
        timeout-minutes: 10
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: ledfx-log-linux-py${{ matrix.python }}
          path: debug_config/ledfx.log

  test-windows:
    name: Test (Windows, py${{ matrix.python }})
    needs: plan
    if: needs.plan.outputs.code == 'true'
    runs-on: windows-2022 # pinned until we understand why windows-2025 has audio device issues
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"] # oldest and newest supported
    env:
      UV_PYTHON: ${{ matrix.python }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Enable long paths for git
        run: git config --system core.longpaths true
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: ${{ needs.plan.outputs.release != 'true' }} # zizmor: ignore[cache-poisoning] off on release runs
          cache-dependency-glob: uv.lock
      - name: Install LedFx
        run: uv sync --all-extras --dev
      - uses: LABSN/sound-ci-helpers@d08c889a7bba7d9b1b059f8f76dac4672ea3a9cf # v1.0.4
      - name: Run tests
        run: uv run pytest -v --timeout=120
        timeout-minutes: 10
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: ledfx-log-windows-py${{ matrix.python }}
          path: debug_config/ledfx.log

  test-macos:
    name: Smoke test (macOS arm64, py${{ matrix.python }})
    needs: plan
    if: needs.plan.outputs.code == 'true'
    runs-on: macos-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"] # oldest and newest supported
    env:
      UV_PYTHON: ${{ matrix.python }}
      CMAKE_POLICY_VERSION_MINIMUM: "3.5" # samplerate on Python 3.10 with CMake 4.x
      CFLAGS: -Wno-incompatible-function-pointer-types
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Install system dependencies
        run: brew install portaudio mbedtls@2
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: ${{ needs.plan.outputs.release != 'true' }} # zizmor: ignore[cache-poisoning] off on release runs
          cache-dependency-glob: uv.lock
      - name: Install LedFx
        run: |
          mbedtls=$(brew --prefix mbedtls@2)
          export PATH="$mbedtls/bin:$PATH" LDFLAGS="-L$mbedtls/lib" CPPFLAGS="-I$mbedtls/include"
          uv sync --all-extras --dev
      - name: Check LedFx launches
        run: uv run ledfx --ci-smoke-test -vv -c debug_config --offline
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: ledfx-log-macos-py${{ matrix.python }}
          path: debug_config/ledfx.log

  frozen-windows:
    name: Frozen build (Windows)
    needs: plan
    if: needs.plan.outputs.code == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Enable long paths for git
        run: git config --system core.longpaths true
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: ${{ needs.plan.outputs.release != 'true' }} # zizmor: ignore[cache-poisoning] off on release runs
          cache-dependency-glob: uv.lock
      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis
          echo "C:\Program Files (x86)\NSIS\Bin" | Out-File -FilePath "$env:GITHUB_PATH" -Append
          echo "C:\Program Files (x86)\NSIS" | Out-File -FilePath "$env:GITHUB_PATH" -Append
      - name: Install LedFx
        run: uv sync --extra hue --group build
      - name: Build binary
        run: uv run pyinstaller windows-binary.spec
      - name: Swap in WASAPI loopback portaudio
        run: mv -f loopback/libportaudio64bit.dll dist/LedFx/_internal/_sounddevice_data/portaudio-binaries/libportaudio64bit.dll
      - name: Build installer # ledfx.nsi packs dist\LedFx, so package after this
        run: cd installer && makensis //DPRODUCT_VERSION="$VERSION" ledfx.nsi
      - name: Package release archives
        run: |
          mv dist/LedFx "dist/LedFx-$VERSION"
          (cd dist && 7z a "../LedFx-$VERSION-win-x64.zip" "LedFx-$VERSION")
          mv "installer/ledfx-setup-win-$VERSION.exe" "LedFx-$VERSION-setup.exe"
          7z a "LedFx-$VERSION-win-x64-setup.zip" "LedFx-$VERSION-setup.exe"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: release-win-x64
          path: LedFx-${{ env.VERSION }}-win-x64.zip
          if-no-files-found: error
          compression-level: 0
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: release-win-x64-setup
          path: LedFx-${{ env.VERSION }}-win-x64-setup.zip
          if-no-files-found: error
          compression-level: 0

  frozen-macos:
    name: Frozen build (macOS ${{ matrix.suffix }})
    needs: plan
    if: needs.plan.outputs.code == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            suffix: osx-intel
          - runner: macos-latest
            suffix: osx-arm64
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      SUFFIX: ${{ matrix.suffix }}
      CMAKE_POLICY_VERSION_MINIMUM: "3.5"
      CFLAGS: -Wno-incompatible-function-pointer-types
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Install system dependencies
        run: brew install portaudio mbedtls@2
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: ${{ needs.plan.outputs.release != 'true' }} # zizmor: ignore[cache-poisoning] off on release runs
          cache-dependency-glob: uv.lock
      - name: Install LedFx
        run: |
          mbedtls=$(brew --prefix mbedtls@2)
          export PATH="$mbedtls/bin:$PATH" LDFLAGS="-L$mbedtls/lib" CPPFLAGS="-I$mbedtls/include"
          uv sync --extra hue --group build
      - name: Build binary
        run: uv run pyinstaller osx-binary.spec
      # tar here: upload-artifact drops the permissions and symlinks an .app needs
      - name: Package release archive
        run: |
          chmod +x dist/LedFx/Contents/MacOS/LedFx
          mv dist/LedFx "dist/LedFx-$VERSION.app"
          xattr -cr "dist/LedFx-$VERSION.app"
          tar -C dist -czf "LedFx-$VERSION-$SUFFIX.tar.gz" "LedFx-$VERSION.app"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: release-${{ matrix.suffix }}
          path: LedFx-${{ env.VERSION }}-${{ matrix.suffix }}.tar.gz
          if-no-files-found: error
          compression-level: 0

  # Clean runners on purpose: they catch libraries missing from the bundle
  # that the build runner happens to have installed.
  smoke-windows:
    name: Smoke test frozen build (Windows)
    needs: [plan, frozen-windows]
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: LABSN/sound-ci-helpers@d08c889a7bba7d9b1b059f8f76dac4672ea3a9cf # v1.0.4
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: release-win-x64
      - name: Run LedFx
        run: |
          7z x "LedFx-$VERSION-win-x64.zip"
          "LedFx-$VERSION/LedFx.exe" -vv --ci-smoke-test --offline

  smoke-macos:
    name: Smoke test frozen build (macOS ${{ matrix.suffix }})
    needs: [plan, frozen-macos]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            suffix: osx-intel
          - runner: macos-latest
            suffix: osx-arm64
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      SUFFIX: ${{ matrix.suffix }}
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: release-${{ matrix.suffix }}
      - name: Run LedFx
        run: |
          tar -xzf "LedFx-$VERSION-$SUFFIX.tar.gz"
          "./LedFx-$VERSION.app/Contents/MacOS/LedFx" -vv --ci-smoke-test --offline

  package:
    name: Build Python package
    needs: plan
    if: needs.plan.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: ${{ needs.plan.outputs.release != 'true' }} # zizmor: ignore[cache-poisoning] off on release runs
          cache-dependency-glob: uv.lock
      - name: Write ledfx.env
        env:
          RELEASE: ${{ needs.plan.outputs.release }}
        run: |
          echo "GITHUB_SHA = \"$GITHUB_SHA\"" >> ledfx.env
          echo "IS_RELEASE = $RELEASE" >> ledfx.env
      - name: Build wheel and sdist
        run: uv build
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: python-dist
          path: dist/
          if-no-files-found: error

  smoke-package:
    name: Smoke test Python package (${{ matrix.kind }})
    needs: [plan, package]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        kind: [whl, tar.gz]
    env:
      KIND: ${{ matrix.kind }}
    steps:
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y portaudio19-dev
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: python-dist
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: false
      - name: Install and run LedFx
        run: |
          uv venv
          uv pip install ledfx-*."$KIND"
          .venv/bin/ledfx -vv --ci-smoke-test --offline

  docker:
    name: Docker (${{ matrix.arch }})
    needs: plan
    if: needs.plan.outputs.code == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      ARCH: ${{ matrix.arch }}
      # push events are only main and v* tags; forks never publish
      PUBLISH: ${{ github.event_name == 'push' && github.repository == 'LedFx/LedFx' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Log in to Docker Hub
        if: env.PUBLISH == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ledfx_docker/Dockerfile
          platforms: linux/${{ matrix.arch }}
          load: true
          push: false
          provenance: false
          sbom: false
          tags: ledfx:ci
          # Release builds never touch a cache: a tag run can read caches written on main.
          no-cache: ${{ needs.plan.outputs.release == 'true' }}
          cache-from: ${{ needs.plan.outputs.release != 'true' && format('type=registry,ref={0}:cache-{1}', env.GHCR_IMAGE, matrix.arch) || '' }}
          cache-to: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && format('type=registry,ref={0}:cache-{1},mode=max', env.GHCR_IMAGE, matrix.arch) || '' }}
          build-args: |
            GITHUB_SHA=${{ github.sha }}
            IS_RELEASE=${{ needs.plan.outputs.release }}
      - name: Smoke test
        run: docker run --rm ledfx:ci --ci-smoke-test -vv --offline
      - name: Push the tested image
        if: env.PUBLISH == 'true'
        run: |
          for image in "$GHCR_IMAGE" "$DOCKERHUB_IMAGE"; do
            docker tag ledfx:ci "$image:edge-$ARCH"
            docker push "$image:edge-$ARCH"
            docker tag ledfx:ci "$image:edge-$ARCH-$GITHUB_SHA"
            digest=$(docker push "$image:edge-$ARCH-$GITHUB_SHA" | awk '/digest: sha256:/ {print $3}')
            test -n "$digest"
            echo "$image@$digest" >> "docker-$ARCH.txt"
          done
      # Releases promote these digests, not the edge tags: a main run of the
      # same commit may retag those with a cached image while approval waits.
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: env.PUBLISH == 'true'
        with:
          name: docker-${{ matrix.arch }}
          path: docker-${{ matrix.arch }}.txt
          if-no-files-found: error

  docker-edge:
    name: Docker edge manifest
    needs: [plan, ci-passed]
    if: github.event_name == 'push' && github.repository == 'LedFx/LedFx'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Create edge manifests
        run: |
          for image in "$GHCR_IMAGE" "$DOCKERHUB_IMAGE"; do
            docker buildx imagetools create -t "$image:edge" -t "$image:edge-$GITHUB_SHA" \
              "$image:edge-amd64-$GITHUB_SHA" "$image:edge-arm64-$GITHUB_SHA"
          done

  # The one check branch protection requires. Every build/test job belongs in
  # needs; its name must never change.
  ci-passed:
    name: CI passed
    if: always()
    needs:
      - plan
      - test-linux
      - test-windows
      - test-macos
      - frozen-windows
      - frozen-macos
      - smoke-windows
      - smoke-macos
      - package
      - smoke-package
      - docker
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail if any job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1

  # Release: tag v<version> only. Each job only downloads tested artifacts and
  # publishes them; one approval of the production environment releases all.
  github-release:
    name: Publish GitHub release
    needs: [plan, ci-passed]
    if: needs.plan.outputs.release == 'true'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: release-*
          merge-multiple: true
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          name: LedFx ${{ needs.plan.outputs.version }}
          files: LedFx-*
          fail_on_unmatched_files: true
          generate_release_notes: true

  pypi:
    name: Publish to PyPI
    needs: [plan, ci-passed]
    if: needs.plan.outputs.release == 'true'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write # Trusted Publishing
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: python-dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  docker-latest:
    name: Publish Docker latest
    needs: [plan, ci-passed]
    if: needs.plan.outputs.release == 'true'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: docker-*
          merge-multiple: true
      - name: Create release manifests
        run: |
          for image in "$GHCR_IMAGE" "$DOCKERHUB_IMAGE"; do
            mapfile -t sources < <(grep -h "^$image@" docker-*.txt)
            test "${#sources[@]}" -eq 2
            docker buildx imagetools create -t "$image:latest" -t "$image:$VERSION" -t "$image:$GITHUB_SHA" "${sources[@]}"
          done

  sentry:
    name: Notify Sentry of release
    needs: [plan, ci-passed]
    if: needs.plan.outputs.release == 'true'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Commit history for Sentry only; nothing is built.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: getsentry/action-release@ff07929a6537bac57790c3451cf4d364aca38528 # v3.7.0
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN_V2 }}
          SENTRY_ORG: ledfx-org
          SENTRY_PROJECT: ledfx-v2-rel
        with:
          environment: production
          release: ledfx@${{ needs.plan.outputs.version }}
