# Publication is complete before this workflow starts. Use default-branch code
# for automatic deliveries and retries; release metadata is only script input.
# App contents-write is solely for durable notification checkpoints. No
# production approval or publication operation runs on a notification retry.
name: Release notifications

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag to notify or resume
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-notifications-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false
  queue: max

jobs:
  notify:
    name: Deliver release notifications
    if: >-
      github.repository == 'LedFx/LedFx' &&
      (github.event_name == 'release' ||
       github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: .github/ci_scripts
      - name: Fetch the published release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9][0-9A-Za-z.+-]*$ ]]; then
            echo "::error::Expected a version release tag"
            exit 1
          fi
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" > "$RUNNER_TEMP/release.json"
      - name: Mint the checkpoint token
        id: state-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.AUTOMATION_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
      - name: Post or resume the changelog and announcement
        env:
          RELEASE_STATE_TOKEN: ${{ steps.state-token.outputs.token }}
          DISCORD_ANNOUNCEMENTS_WEBHOOK: ${{ secrets.DISCORD_ANNOUNCEMENTS_WEBHOOK }}
          DISCORD_RELEASETHREAD_WEBHOOK: ${{ secrets.DISCORD_RELEASETHREAD_WEBHOOK }}
          SHAUNS_OPENROUTER_KEY: ${{ secrets.SHAUNS_OPENROUTER_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL || 'openrouter/auto' }}
        run: python3 .github/ci_scripts/announce_release.py "$RUNNER_TEMP/release.json"
