# Posts the "lint gate failed" comment on pull requests.
#
# Runs in the trusted workflow_run context: GitHub executes *this file from
# the default branch*, not from the PR, so pull-request code cannot touch it
# and the ledfx-automation secrets are available here — they are never
# available to ci.yml, which runs pull-request code.
#
# The triggering run's own conclusion is the signal (no success/fail payload
# is passed between workflows): this workflow looks up the Lint (prek) job of
# that run and posts only when it failed. Two tokens, minimal surfaces:
#   - GITHUB_TOKEN (actions: read) reads the job conclusion.
#   - ledfx-automation app token (pull-requests: write) posts the comment,
#     so it authors as ledfx-automation[bot] and notifies subscribers.

name: Lint failure notify

# zizmor flags workflow_run as a dangerous trigger (dangerous-triggers, high).
# This instance is the safe shape, by construction:
#   * GitHub always executes the default-branch version of this file — PR code
#     cannot alter it, including via the PR's own branch or its actions.
#   * This workflow never checks out a ref and never executes PR-controlled
#     code or scripts; every step is `gh api` reads plus a fixed comment body.
#   * No interpolation of PR-controlled values into run blocks: branch/PR
#     identifiers flow only through `gh` arguments (no shell injection via
#     GITHUB_ENV or heredocs).
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  actions: read

concurrency:
  group: lint-notify-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  notify:
    name: Comment on lint failure
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Same paths-skip contract as ci.yml's plan job: docs/frontend-only
    # changes never run the lint gate, so there is nothing to report.
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'failure'
    steps:
      - name: Find the failed Lint (prek) job
        id: lint
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          job="$(gh api "repos/${{ github.repository }}/actions/runs/$RUN_ID/jobs" \
            --jq '.jobs[] | select(.name == "Lint (prek)") | {id, conclusion} | tostring')"
          echo "job=$job" >> "$GITHUB_OUTPUT"
          echo "lint job: $job"

      - name: Skip unless the lint gate failed
        if: fromJSON(steps.lint.outputs.job).conclusion != 'failure'
        run: |
          echo "Lint (prek) did not fail (conclusion: $(echo '${{ steps.lint.outputs.job }}' | jq -r .conclusion)); nothing to report."
          exit 0

      - name: Link the PR
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          pr="$(gh api "repos/${{ github.repository }}/actions/runs/$RUN_ID" \
            --jq '[.pull_requests[] | {number, id}][0].number')"
          if [ -z "$pr" ]; then
            # workflow_run's pull_requests is empty for fork PRs; resolve via
            # the head branch (one open PR per branch is the repo convention).
            head_branch="$(gh api "repos/${{ github.repository }}/actions/runs/$RUN_ID" --jq .head_branch)"
            pr="$(gh api "repos/${{ github.repository }}/pulls?head=${{ github.repository_owner }}:$head_branch&state=open" --jq '.[0].number')"
          fi
          if [ -z "$pr" ]; then
            echo "No open PR for this run; nothing to comment on."
            echo "number=" >> "$GITHUB_OUTPUT"
          else
            echo "number=$pr" >> "$GITHUB_OUTPUT"
          fi

      - name: Mint the ledfx-automation token
        if: steps.pr.outputs.number != ''
        id: bot-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.AUTOMATION_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
          permission-pull-requests: write # comments only; do not inherit blanket installation permissions

      - name: Comment
        if: steps.pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
          PR: ${{ steps.pr.outputs.number }}
          REPO: ${{ github.repository }}
          RUN: ${{ github.event.workflow_run.html_url }}
        run: |
          gh pr comment "$PR" --repo "$REPO" --body "🚫 **Build and test jobs were skipped: linting must pass first.**

          The [Lint (prek)]($RUN) job failed. Most findings are auto-fixed: the [autofix workflow](https://github.com/$REPO/actions/workflows/autofix.yml) pushes a fix commit to this PR and CI re-runs automatically. If no autofix commit appears, the finding has no autofix — open the run log for the exact rule and line, fix it, and push.

          Local check: \`uv run prek run --all-files\`."
